[tool.poetry]
name = "taskforge"
version = "0.1.0"
description = "A powerful distributed task processing framework"
authors = ["Chetan Choudhary"]
readme = "README.md"
packages = [{ include = "taskforge" }]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.1"
sqlalchemy = {extras = ["async"], version = "^2.0.15"}
aio-pika = "^9.4.0"
asyncpg = "^0.29.0"
pydantic = "^2.6.1"
uvicorn = "^0.27.1"
prometheus-client = "^0.19.0"
redis = "^5.0.1"
alembic = "^1.11.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
structlog = "^24.1.0"
prometheus-fastapi-instrumentator = "^7.0.0"
greenlet = "^3.1.1"
pydantic-settings = "^2.7.1"
opentelemetry-distro = "^0.50b0"
aiohttp = "^3.11.11"
dependency-injector = "^4.44.0"
croniter = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.5"
black = "^24.1.1"
isort = "^5.13.2"
mypy = "^1.8.0"

[tool.poetry.scripts]
taskforge = "taskforge.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
